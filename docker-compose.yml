name: qrhub

services:
  frontend:
    container_name: qrhub_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - qrhub_network
    depends_on:
      - nginx

  backend:
    container_name: qrhub_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - qrhub_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    container_name: qrhub_nginx
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - qrhub_network
    depends_on:
      - backend

  postgres:
    container_name: qrhub_postgres
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: qrhub
      POSTGRES_USER: qrhub
      POSTGRES_PASSWORD: qrhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qrhub_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrhub -d qrhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: qrhub_redis
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - qrhub_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  qrhub_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules: